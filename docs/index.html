<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サイバーセキュリティ学習</title>
  <meta name="description" content="初級・中級・上級・超級のレッスンと4択クイズで、サイバーセキュリティを段階的に学べる学習サイトです。">
  <!-- タブのアイコン（盾と南京錠）。PNG は、SVG のアイコンに対応していない環境やホーム画面用 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Google アナリティクス（公開サイトで開いたときだけ読み込む。手元での確認やテストは計測しない） -->
  <script>
    window.GA_MEASUREMENT_ID = "G-C5PGS1FVLE";
    if (location.hostname === "ma0531.github.io") {
      var gaScript = document.createElement("script");
      gaScript.async = true;
      gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + window.GA_MEASUREMENT_ID;
      document.head.appendChild(gaScript);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      // ページビューは、画面を切り替えるたびに app.js から送るため、ここでの自動送信は止める
      window.gtag("config", window.GA_MEASUREMENT_ID, { send_page_view: false });
    }
  </script>
  <!-- 読みやすい日本語フォント（読み込めない環境では、端末のフォントで表示される） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 一番上の帯：左に最終更新日と作成者、右に言語の切り替え（中身は app.js が入れる） -->
  <div class="top-bar">
    <div class="inner">
      <p class="site-meta" id="site-meta"></p>
      <div class="lang-switch" role="group" aria-label="言語 / Language">
        <button type="button" data-lang="ja" lang="ja">日本語</button>
        <button type="button" data-lang="en" lang="en">English</button>
      </div>
    </div>
  </div>

  <!-- data-i18n が付いた文字は、選んだ言語に合わせて app.js が書き換える -->
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="#/" data-i18n="brand">サイバーセキュリティ学習</a>
      <nav>
        <a href="#/lessons/beginner" data-i18n="navLessons">レッスン</a>
        <a href="#/quiz" data-i18n="navQuiz">クイズ</a>
        <a href="#/certifications" data-i18n="navCerts">資格</a>
        <a href="#/websites" data-i18n="navSites">おすすめWebサイト</a>
      </nav>
    </div>
  </header>

  <main id="view">
    <p class="sub">読み込み中… / Loading…</p>
  </main>

  <!-- フッターの文章は app.js が入れる -->
  <footer id="site-footer"></footer>

  <!-- 言語を決めて、その言語の学習データ（tools/build_site.py で生成）と、画面の処理を順番に読み込む -->
  <script>
    (function () {
      // 言語の決め方：URL の ?lang=en → 前回選んだ言語 → 日本語
      var lang = null;
      var match = /[?&]lang=(ja|en)(&|$)/.exec(location.search);
      if (match) lang = match[1];
      if (!lang) {
        try { lang = localStorage.getItem("lang"); } catch (e) { /* 保存領域が使えない環境では日本語にする */ }
      }
      window.SITE_LANG = lang === "en" ? "en" : "ja";
      document.documentElement.lang = window.SITE_LANG;

      [window.SITE_LANG === "en" ? "data.en.js" : "data.js", "app.js"].forEach(function (src) {
        var script = document.createElement("script");
        script.src = src;
        script.async = false; // 書いた順番に実行させる（データ → 画面の処理）
        document.body.appendChild(script);
      });
    })();
  </script>
</body>
</html>
